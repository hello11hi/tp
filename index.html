<!DOCTYPE html>
<html lang="ar" dir="rtl" data-t="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة فاطمة للدراسة</title>
<style>
:root{--bg:#0b1016;--card:#141c26;--c2:#1a2532;--ac:#39d3c0;--tx:#e6edf3;--mut:#8b9bb0;--ok:#2ecc8f;--bad:#ef6b6b;--bd:#26344a}
[data-t=light]{--bg:#f2f6f8;--card:#fff;--c2:#e8eff3;--ac:#0f9d8c;--tx:#14202b;--mut:#5a6b7d;--bd:#d3dde4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
#app{display:none;min-height:100vh}
nav{position:fixed;z-index:5;background:var(--card);display:flex;border:1px solid var(--bd)}
nav button{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;display:flex;align-items:center;gap:8px;padding:10px}
nav button.on{color:var(--ac);background:var(--c2)}
nav i{font-style:normal}
@media(min-width:800px){nav{top:0;right:0;bottom:0;width:190px;flex-direction:column;padding:12px 6px}main{margin-right:190px}}
@media(max-width:799px){nav{bottom:0;left:0;right:0;overflow-x:auto;justify-content:space-around}nav button{flex-direction:column;gap:0;font-size:.62rem;padding:6px 8px}nav i{font-size:1.2rem}main{padding-bottom:80px}}
main{padding:16px;max-width:900px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.tp{cursor:pointer}.tp:hover{border-color:var(--ac)}
h1,h2,h3{margin:.5em 0}h2{color:var(--ac)}
button{font:inherit;color:var(--tx);background:var(--c2);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;cursor:pointer}
button.pr{background:var(--ac);color:#06201c;border-color:var(--ac);font-weight:700}
button.on{border-color:var(--ac);color:var(--ac)}
.en{display:block;text-align:left;direction:ltr}.ar{display:block;color:var(--mut)}
.ar2{color:var(--mut)}.mut{color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
.st{font-size:1.2rem;background:none;border:0}
.lk{background:none;border:0;color:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.opt{display:flex;gap:10px;width:100%;text-align:right;margin:6px 0;align-items:flex-start}
.opt.ok{border-color:var(--ok);background:rgba(46,204,143,.15)}
.opt.bad{border-color:var(--bad);background:rgba(239,107,107,.15)}
.opt.sel{border-color:var(--ac);background:rgba(57,211,192,.15)}
.ex{background:var(--c2);border-radius:10px;padding:10px;margin-top:10px}
.okc{border-right:4px solid var(--ok)}.badc{border-right:4px solid var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stats b{display:block;font-size:1.6rem;color:var(--ac)}
.bar{background:var(--c2);height:10px;border-radius:9px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .6s}
.grid{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
.grid button{width:38px;padding:6px 0}
.grid .a{background:rgba(57,211,192,.2)}.grid .f{border-color:#e8b84a}.grid .cur{outline:2px solid var(--ac)}
.fcard{min-height:170px;text-align:center;cursor:pointer;font-size:1.1rem}
.in,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:6px 0}
.top{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
#intro{display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,#fde8ef,#e5f4e8 55%,#e8eefc);color:#4a3b47;overflow:hidden;transition:opacity .7s}
#intro .box{position:relative;z-index:2;padding:24px;max-width:520px}
#intro button{background:#fff;color:#7a3b5b;border:1px solid #f1bfd3;margin:6px;padding:10px 18px;font-size:1rem}
#intro button.go{background:#f48fb1;color:#fff;border:0}
.fade{opacity:0;animation:fi 1s forwards}
@keyframes fi{to{opacity:1}}
.pt{position:absolute;top:-10%;font-size:1.4rem;animation:fall linear infinite;z-index:1}
@keyframes fall{to{transform:translateY(115vh) rotate(300deg)}}
.cat{font-size:4rem;display:inline-block;animation:bob 2.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fade{opacity:1}}
table{border-collapse:collapse;width:100%;min-width:480px}td,th{border:1px solid var(--bd);padding:6px;vertical-align:top;text-align:right}th{background:var(--c2)}.chip{display:inline-block;background:var(--c2);color:var(--ac);border-radius:9px;padding:1px 10px;font-size:.8rem}textarea.in{resize:vertical}</style>
</head>
<body>
<div id="intro"></div>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<script>
// ===== DATA: built only from the 3 uploaded PDFs (partial selection; see notes) =====
// bilingual strings use "English|العربية"
const C=[["1","Pain Anatomy & Pathophysiology|تشريح وفيزيولوجيا الألم المرضية"],["2","History & Examination of Pain|تاريخ وفحص الألم"],["3","Pain Clinic Instruments & Anesthesia|أدوات عيادة الألم والتخدير"]];
// topic: [id, chapter, title, points[[termEn, termAr, defEn, defAr]]]
const T=[
["t1","1","Pain & Nociception|الألم والاستقبال الألمي",[
["Pain","الألم","An unpleasant sensory and emotional experience associated with, or resembling that associated with, actual or potential tissue damage.","تجربة حسية وعاطفية غير سارة مرتبطة بتلف الأنسجة الفعلي أو المحتمل، أو تشبه ذلك."],
["Nociception","الاستقبال الألمي","Neural encoding of noxious stimuli; can occur without conscious pain; begins at nociceptors.","الترميز العصبي للمحفزات الضارة؛ يمكن أن يحدث دون ألم واعٍ؛ ويبدأ من المستقبلات الألمية."]]],
["t2","1","Primary Afferent Fibers|الألياف الواردة الأولية",[
["Aδ fibers","ألياف Aδ","Thinly myelinated, small, fast (~5–30 m/s); sharp, pricking, well localized pain; “first pain”.","رقيقة الميالين، صغيرة، سريعة؛ ألم حاد وخزي جيد التحديد؛ «الألم الأول»."],
["C fibers","ألياف C","Unmyelinated, very small, slow (~0.5–2 m/s); dull, burning, aching, poorly localized pain; “second pain”.","غير ميالينية، صغيرة جداً، بطيئة؛ ألم كليل حارق مبهم التحديد؛ «الألم الثاني»."]]],
["t3","1","Spinal Cord Processing|المعالجة في النخاع الشوكي",[
["Dorsal horn","القرن الظهري","First major processing station; primary afferents synapse mainly in laminae I, II and V; glutamate and substance P are the major excitatory transmitters.","أول محطة معالجة رئيسية؛ تتشابك الواردات الأولية خاصة في الصفائح I وII وV؛ الغلوتامات والمادة P أهم الناقلات المثيرة."],
["Spinothalamic tract","السبيل النخاعي المهادي","Second-order neurons cross within the spinal cord; anterolateral lesions cause contralateral loss of pain and temperature below the lesion.","تتقاطع العصبونات من الدرجة الثانية داخل النخاع؛ تسبب آفات الجهاز الأمامي الجانبي فقدان الألم والحرارة في الجهة المقابلة أسفل الآفة."]]],
["t4","1","Sensitization|التحسس",[
["Peripheral sensitization","التحسس المحيطي","Inflammatory mediators (PGE₂, bradykinin, H⁺, ATP, cytokines, NGF) lower nociceptor threshold → primary hyperalgesia.","الوسائط الالتهابية تخفض عتبة المستقبلات الألمية ← فرط الألم الأولي."],
["Central sensitization","التحسس المركزي","Repeated/intense input → NMDA receptor activation and Ca²⁺ influx, increased dorsal horn excitability, reduced inhibition; pain persists after the stimulus.","المدخلات المتكررة/الشديدة ← تنشيط مستقبلات NMDA ودخول الكالسيوم، زيادة استثارة القرن الظهري، نقص التثبيط؛ يستمر الألم بعد زوال المحفز."],
["Allodynia","الألودينيا","Pain due to a stimulus that does not normally provoke pain (e.g., light touch after nerve injury).","ألم ناتج عن محفز لا يسبب الألم عادة (مثل اللمس الخفيف بعد إصابة عصبية)."],
["Hyperalgesia","فرط الألم","Exaggerated pain response to a stimulus that is normally painful (e.g., pinprick).","استجابة ألم مبالغ فيها لمحفز مؤلم أصلاً (مثل وخز الدبوس)."]]],
["t5","1","Pain Mechanisms & Drug Targets|آليات الألم وأهداف الأدوية",[
["Nociceptive pain","الألم الحسي الاستقبالي","Activation of nociceptors by tissue injury; somatic (skin, muscle, bone) or visceral (often diffuse/referred).","تنشيط المستقبلات الألمية بإصابة الأنسجة؛ جسدي أو حشوي (غالباً منتشر/محال)."],
["Neuropathic pain","الألم العصبي","Lesion or disease of the somatosensory nervous system; burning, electric, shooting; e.g., diabetic neuropathy, postherpetic neuralgia.","آفة أو مرض في الجهاز العصبي الحسي الجسدي؛ حارق، كهربائي، طاعن؛ مثل اعتلال الأعصاب السكري والألم العصبي التالي للهربس."],
["Nociplastic pain","الألم المتغير الإدراك","Altered nociception without clear tissue damage or nerve lesion; prototype: fibromyalgia.","تغير في معالجة الألم دون تلف نسيجي أو آفة عصبية واضحة؛ النموذج الأولي: الألم العضلي الليفي."],
["Descending modulation","التعديل التنازلي","Cortex/limbic → PAG → RVM/locus coeruleus → dorsal horn inhibition; mediators: endogenous opioids, serotonin, norepinephrine, GABA/glycine.","القشرة/الجهاز الحوفي ← PAG ← RVM/المنطقة الزرقاء ← تثبيط القرن الظهري؛ الوسائط: الأفيونات الذاتية، السيروتونين، النورأدرينالين، GABA/الغليسين."],
["Drug targets","أهداف الأدوية","NSAIDs block COX (↓ prostaglandin sensitization); local anesthetics block voltage-gated Na⁺ channels; opioids reduce transmitter release; ketamine is an NMDA antagonist.","مضادات الالتهاب غير الستيرويدية تثبط COX؛ المخدرات الموضعية تحجب قنوات الصوديوم؛ الأفيونات تقلل إطلاق الناقلات؛ الكيتامين مضاد NMDA."]]],
["t6","2","Pain History & Scales|تاريخ الألم والمقاييس",[
["OPQRST","OPQRST","O Onset, P Provocation/Palliation, Q Quality, R Region/Radiation, S Severity (0–10), T Timing.","O البداية، P المحرضات/المخففات، Q الجودة، R المنطقة/الانتشار، S الشدة (0–10)، T التوقيت."],
["Pain scales","مقاييس الألم","NRS: 0 = no pain, 10 = worst imaginable; VAS: mark on a continuum; scores 1–3 mild, 4–6 moderate, 7–10 severe.","NRS: 0 لا ألم، 10 أسوأ ألم متخيل؛ VAS: علامة على خط متصل؛ 1–3 خفيف، 4–6 متوسط، 7–10 شديد."]]],
["t7","2","Red Flags|العلامات الحمراء",[
["Red flags","العلامات الحمراء","Do not establish a diagnosis by themselves; they indicate the need for urgent assessment or targeted investigation.","لا تثبت تشخيصاً بحد ذاتها؛ بل تدل على الحاجة إلى تقييم عاجل أو فحوص موجهة."],
["Neurologic emergency","الطوارئ العصبية","Progressive motor deficit, saddle anesthesia, urinary retention/incontinence.","عجز حركي متدرج، تخدر السرج، احتباس البول/سلس البول."]]],
["t8","3","Needles & Gauge|الإبر والقياس",[
["Gauge","مقياس الإبرة","A larger gauge number means a smaller external diameter.","الرقم الأكبر لمقياس الإبرة يعني قطراً خارجياً أصغر."],
["Tuohy needle","إبرة توهي","A curved epidural bevel facilitates epidural catheter techniques.","شطبة فوق جافية منحنية تسهل تقنيات القسطرة فوق الجافية."],
["RF cannula","قنية الترددات الراديوية","Insulated shaft with an exposed active tip; accepts a compatible RF electrode.","عمود معزول بطرف نشط مكشوف؛ تقبل قطب RF متوافقاً."],
["Stimulating block needle","إبرة الكتلة المحفزة","Insulated needle connected to a nerve stimulator for selected peripheral blocks.","إبرة معزولة متصلة بمحفز عصبي لكتل طرفية مختارة."]]],
["t9","3","Local Anesthetics & Dose|المخدرات الموضعية والجرعة",[
["Concentration & dose","التركيز والجرعة","1% = 10 mg/mL; Total dose (mg) = concentration (mg/mL) × volume (mL). Example: 8 mL of 0.5% = 5 × 8 = 40 mg. A calculation is not a dosing recommendation.","1% = 10 ملغ/مل؛ الجرعة الكلية = التركيز × الحجم. مثال: 8 مل من 0.5% = 5 × 8 = 40 ملغ. الحساب ليس توصية بجرعة."],
["Lidocaine vs bupivacaine","الليدوكائين مقابل البوبيفاكائين","Lidocaine: generally faster onset. Bupivacaine: longer-lasting; systemic exposure can cause severe cardiotoxicity.","الليدوكائين: بداية أسرع عموماً. البوبيفاكائين: أطول أمداً؛ التعرض الجهازي قد يسبب سمية قلبية شديدة."]]],
["t10","3","LAST & Sedation|سمية المخدر الموضعي والتركين",[
["LAST","سمية المخدر الموضعي الجهازية","Early: perioral numbness, metallic taste, tinnitus, agitation. Severe: seizures, arrhythmias, collapse. Response: stop injection, call for help, bring 20% lipid emulsion and ASRA checklist.","مبكراً: خدر حول الفم، طعم معدني، طنين، هياج. شديدة: نوبات، اضطراب نظم، انهيار. الاستجابة: أوقف الحقن، اطلب المساعدة، أحضر مستحلب الدهون 20% وقائمة ASRA."],
["Sedation continuum","استمرارية التركين","Minimal: normal response to speech. Moderate: purposeful response to speech/light touch. Deep: needs repeated or painful stimulation. General anesthesia: no arousal to pain.","الأدنى: استجابة طبيعية للكلام. المتوسط: استجابة هادفة للكلام/اللمس الخفيف. العميق: يحتاج تحفيزاً متكرراً أو مؤلماً. العام: لا استجابة للألم."],
["Monitored anesthesia care (MAC)","رعاية التخدير المراقبة","An anesthesia service that can include different sedation depths; it does not specify one particular depth.","خدمة تخدير يمكن أن تشمل أعماقاً مختلفة للتركين؛ ولا تحدد عمقاً واحداً."]]],
["t11","1","Pain Pathway & Nociceptors|مسار معالجة الألم والمستقبلات الألمية",[
["Pain processing pathway","مسار معالجة الألم","Noxious stimulus → nociceptor → peripheral nerve → spinal cord → brainstem/thalamus → cortex & limbic system. Processing is bidirectional: ascending input is continuously modified by descending control.","محفز ضار ← مستقبل ألمي ← عصب محيطي ← نخاع شوكي ← جذع الدماغ/مهاد ← قشرة وجهاز حوفي. المعالجة ثنائية الاتجاه: المدخلات الصاعدة تُعدَّل باستمرار بالتحكم التنازلي."],
["Peripheral nociceptors","المستقبلات الألمية الطرفية","Free nerve endings of primary sensory neurons; cell bodies in dorsal root ganglia (DRG) or trigeminal ganglia; activated by mechanical, thermal or chemical stimuli. High-threshold receptors respond to potentially damaging stimuli; polymodal nociceptors respond to more than one stimulus type.","نهايات عصبية حرة للعصبونات الحسية الأولية؛ أجسامها في العقد الجذرية الظهرية (DRG) أو العقدة ثلاثية التوائم؛ تُنشَّط بمحفزات ميكانيكية أو حرارية أو كيميائية. ذات العتبة العالية تستجيب لمحفزات ضارة محتملة؛ متعددة الوسائط تستجيب لأكثر من نوع."],
["Four processes of nociception","العمليات الأربع","Transduction: noxious stimulus → electrical signal. Transmission: nerve → spinal cord → brain. Modulation: signal amplified or inhibited. Perception: conscious experience of pain.","النقل (Transduction): محفز ضار ← إشارة كهربائية. التوصيل (Transmission): عصب ← نخاع ← دماغ. التعديل (Modulation): تضخيم الإشارة أو تثبيطها. الإدراك (Perception): التجربة الواعية للألم."]]],
["t12","1","Transduction & Inflammatory Soup|النقل الحسي والحساء الالتهابي",[
["Transduction steps","خطوات النقل الحسي","Tissue damage → inflammatory mediators → ion channel activation → generator potential → action potential.","تلف الأنسجة ← وسائط التهابية ← تنشيط القنوات الأيونية ← الجهد المولِّد ← جهد الفعل."],
["Key channels / receptors","القنوات والمستقبلات الرئيسية","TRPV1: heat, capsaicin, H⁺. ASIC: acidic environment. P2X: ATP. Plus mechanosensitive channels.","TRPV1: الحرارة والكابسيسين وH⁺. ASIC: البيئة الحمضية. P2X: ATP. إضافة إلى القنوات الحساسة ميكانيكياً."],
["Inflammatory soup","الحساء الالتهابي","NGF, bradykinin, cytokines, histamine, PGE₂, H⁺/K⁺ and ATP lower nociceptor threshold → peripheral sensitization → tenderness and primary hyperalgesia.","NGF والبراديكينين والسيتوكينات والهيستامين وPGE₂ وH⁺/K⁺ وATP تخفض عتبة المستقبلات الألمية ← تحسس محيطي ← ألم عند اللمس وفرط ألم أولي."]]],
["t13","1","Dorsal Horn & Spinal Transmission|القرن الظهري والنقل الشوكي",[
["Entry & crossing","الدخول والتقاطع","Primary afferents enter via dorsal roots and may travel 1–2 segments in Lissauer’s tract; second-order neurons cross the midline and ascend contralaterally.","تدخل الواردات الأولية عبر الجذور الظهرية وقد تسير 1–2 قطعة في سبيل ليسور؛ تتقاطع العصبونات الثانوية عبر الخط الأوسط وتصعد في الجهة المقابلة."],
["Dorsal horn laminae","صفائح القرن الظهري","I: marginal zone. II: substantia gelatinosa. III–IV: nucleus proprius. V: wide dynamic range.","I: المنطقة الهامشية. II: المادة الجيلاتينية. III–IV: النواة الخاصة. V: ذات المدى الديناميكي الواسع."],
["Excitatory mechanisms","الآليات المثيرة","Glutamate → AMPA receptors; repeated input → NMDA recruitment; substance P / CGRP; all facilitate transmission.","الغلوتامات ← مستقبلات AMPA؛ المدخلات المتكررة ← تجنيد NMDA؛ المادة P / CGRP؛ كلها تسهّل النقل."],
["Inhibitory mechanisms","الآليات المثبطة","GABA and glycine interneurons, endogenous opioids (enkephalins) and descending monoamines gate nociceptive traffic.","العصبونات البينية GABA والغليسين، والأفيونات الذاتية (الإنكيفالينات)، والمونوأمينات التنازلية تتحكم بعبور الإشارات الألمية."]]],
["t14","1","Ascending Pathways & Brain Regions|المسارات الصاعدة ومناطق الدماغ",[
["Spinothalamic","السبيل النخاعي المهادي","Destination: thalamus → somatosensory cortex. Role: location, intensity, discrimination.","الوجهة: المهاد ← القشرة الحسية الجسدية. الدور: الموقع والشدة والتمييز."],
["Spinoreticular","السبيل النخاعي الشبكي","Destination: reticular formation → thalamus. Role: arousal, autonomic responses.","الوجهة: التكوين الشبكي ← المهاد. الدور: اليقظة والاستجابات اللاإرادية."],
["Spinomesencephalic","السبيل النخاعي الدماغي المتوسط","Destination: midbrain / PAG. Role: pain modulation and defensive behavior.","الوجهة: الدماغ المتوسط / PAG. الدور: تعديل الألم والسلوك الدفاعي."],
["Spinohypothalamic","السبيل النخاعي تحت المهادي","Destination: hypothalamus. Role: neuroendocrine and autonomic response.","الوجهة: تحت المهاد. الدور: الاستجابة العصبية الصماوية واللاإرادية."],
["Brain regions in pain","مناطق الدماغ في الألم","Thalamus: relay + integration. S1/S2: location & intensity. Insula: internal bodily state. Anterior cingulate: unpleasantness/affect. Prefrontal cortex: meaning, expectation, attention. Amygdala: fear & emotional learning.","المهاد: نقل وتكامل. S1/S2: الموقع والشدة. الجزيرة: الحالة الداخلية للجسم. الحزام الأمامي: عدم الارتياح/الوجدان. قشرة الفص الجبهي: المعنى والتوقع والانتباه. اللوزة: الخوف والتعلم العاطفي."]]],
["t15","1","Acute vs Chronic Pain & Wind-up|الألم الحاد والمزمن والرياح",[
["Acute pain","الألم الحاد","Usually linked to recent injury or surgery; protective biological role; autonomic activation common; resolves as tissue heals.","يرتبط عادة بإصابة أو جراحة حديثة؛ دور وقائي حيوي؛ التنشيط اللاإرادي شائع؛ يزول بشفاء الأنسجة."],
["Chronic pain","الألم المزمن","Persists beyond expected healing; neural plasticity becomes important; may lose protective function; affects sleep, mood, cognition and function. It is not simply acute pain lasting longer.","يستمر بعد الشفاء المتوقع؛ تصبح اللدونة العصبية مهمة؛ قد يفقد وظيفة الحماية؛ يؤثر في النوم والمزاج والإدراك والوظيفة. ليس مجرد ألم حاد يطول."],
["Wind-up","الرياح (Wind-up)","Progressive increase in dorsal horn response to repeated C-fiber stimulation.","زيادة تدريجية في استجابة القرن الظهري لتحفيز ألياف C المتكرر."],
["Peripheral sensitization mechanisms","آليات التحسس المحيطي","PGE₂ increases excitability through intracellular signaling; bradykinin, H⁺, ATP and cytokines activate/sensitize nociceptors; previously silent nociceptors may become responsive.","يزيد PGE₂ الاستثارة عبر الإشارات داخل الخلوية؛ البراديكينين وH⁺ وATP والسيتوكينات تنشّط/تحسّس المستقبلات؛ قد تصبح المستقبلات «الصامتة» سابقاً مستجيبة."]]],
["t16","1","Neuropathic Mechanisms & Analgesic Targets|آليات الألم العصبي وأهداف المسكنات",[
["Peripheral changes","التغيرات المحيطية","Ectopic impulse generation, sodium channel up-regulation, abnormal spontaneous firing, cross-talk between injured fibers.","توليد نبضات منتبذة، زيادة تعبير قنوات الصوديوم، إطلاق تلقائي غير طبيعي، تداخل بين الألياف المصابة."],
["Central changes","التغيرات المركزية","Central sensitization, loss of inhibitory interneuron function, microglial/neuroimmune activation; Aβ input may access pain circuits.","تحسس مركزي، فقدان وظيفة العصبونات البينية المثبطة، تنشيط الدبق الصغير/المناعة العصبية؛ قد تصل مدخلات Aβ إلى دوائر الألم."],
["Typical descriptors","الأوصاف النموذجية","Burning, electric shocks, shooting pain, tingling; sensory loss may coexist with pain.","حرق، صدمات كهربائية، ألم طاعن، تنميل؛ وقد يتعايش الفقدان الحسي مع الألم."],
["Opioids","الأفيونات","Site: spinal/supraspinal. Effect: reduce transmitter release and neuronal excitability.","الموقع: النخاع/فوق النخاع. التأثير: تقليل إطلاق الناقلات والاستثارة العصبية."],
["α₂-agonists; some antidepressants","ناهضات α₂؛ بعض مضادات الاكتئاب","Site: descending pathways. Effect: enhance inhibitory modulation.","الموقع: المسارات التنازلية. التأثير: تعزيز التعديل المثبط."],
["Ketamine","الكيتامين","Targets central sensitization via NMDA antagonism; reduces NMDA-mediated excitability.","يستهدف التحسس المركزي عبر مضادة NMDA؛ يقلل الاستثارة المعتمدة على NMDA."]]],
["t17","2","Assessment Sequence, SOCRATES & Quality|تسلسل التقييم وSOCRATES وجودة الألم",[
["Assessment sequence","تسلسل التقييم","History → pain scale → physical exam → red flags → mechanism/differential → diagnosis & plan. Diagnosis begins with a careful history and focused exam, not with imaging; history generates hypotheses, examination and tests refine them.","التاريخ ← مقياس الألم ← الفحص ← العلامات الحمراء ← الآلية/التفريقي ← التشخيص والخطة. يبدأ التشخيص بتاريخ دقيق وفحص موجه وليس بالتصوير؛ التاريخ يولد الفرضيات والفحص والاختبارات تصقلها."],
["Core history questions","أسئلة التاريخ الأساسية","Site and radiation; onset and circumstances; character/quality; severity and functional impact; timing and progression; aggravating and relieving factors; associated symptoms.","الموقع والانتشار؛ البداية والظروف؛ الطبيعة/الجودة؛ الشدة والأثر الوظيفي؛ التوقيت والتطور؛ العوامل المفاقمة والمخففة؛ الأعراض المرافقة."],
["SOCRATES","SOCRATES","Site/Onset; Character/Radiation; Associated symptoms; Timing/Exacerbating-relieving; Severity (usually 0–10).","الموقع/البداية؛ الطبيعة/الانتشار؛ الأعراض المرافقة؛ التوقيت/المفاقمات والمخففات؛ الشدة (عادة 0–10)."],
["Pain quality clues","دلائل جودة الألم","Aching, throbbing, tender: often movement/tissue injury. Deep, cramping, poorly localized: may be referred. Burning, electric, shooting: may include numbness or tingling. Words suggest, but do not alone prove, the mechanism.","ألم دائم، نابض، مؤلم باللمس: غالباً مرتبط بالحركة/إصابة النسيج. عميق، تشنجي، مبهم الموضع: قد يكون محالاً. حارق، كهربائي، طاعن: قد يشمل خدراً أو تنميلاً. الكلمات توحي بالآلية لكنها لا تثبتها وحدها."]]],
["t18","2","Function, Modifying Factors & Past History|الوظيفة والعوامل المؤثرة والتاريخ السابق",[
["Functional impact","الأثر الوظيفي","Intensity is only one dimension; functional limitation is often the most meaningful outcome. Domains: mobility, daily activity, sleep, mood & cognition, social function. Goal: what activity does the patient want to regain?","الشدة بُعد واحد فقط؛ والتقييد الوظيفي غالباً أهم نتيجة سريرياً. المجالات: الحركة، النشاط اليومي، النوم، المزاج والإدراك، الوظيفة الاجتماعية. الهدف: أي نشاط تريد المريضة استعادته؟"],
["Aggravating & relieving factors","العوامل المفاقمة والمخففة","Movement/posture (mechanical pain); rest/position (musculoskeletal or radicular); meals/visceral triggers; cold, heat or light touch (neuropathic/allodynia); medication response; time pattern (morning stiffness, nocturnal, exertional).","الحركة/الوضعية (ألم ميكانيكي)؛ الراحة/الوضع (عضلي هيكلي أو جذري)؛ الطعام/المحفزات الحشوية؛ البرد أو الحرارة أو اللمس الخفيف (عصبي/ألودينيا)؛ الاستجابة للدواء؛ نمط الوقت (تيبس صباحي، ليلي، جهدي)."],
["Associated symptoms","الأعراض المرافقة","Neurologic: weakness, numbness, paresthesia, gait disturbance, bowel/bladder dysfunction. Systemic: fever, chills, weight loss, fatigue, night sweats. Cardiorespiratory; GI/GU; persistent pain (sleep, mood, function). Ask symptoms relevant to the painful region, not an indiscriminate checklist.","عصبية: ضعف، خدر، تنميل، اضطراب المشي، خلل الأمعاء/المثانة. جهازية: حمى، قشعريرة، فقدان وزن، تعب، تعرق ليلي. قلبية تنفسية؛ هضمية بولية؛ ألم مستمر (نوم، مزاج، وظيفة). اسأل عن أعراض المنطقة المؤلمة لا قائمة عشوائية."],
["Relevant past history","التاريخ السابق ذو الصلة","Previous pain/trauma/surgery; important diseases (cancer, infection, diabetes, vascular, rheumatologic, neurologic); previous work-up; treatment response; current medication (opioids, NSAIDs, steroids, anticoagulants, antiplatelets); allergy & safety (bleeding risk, renal/hepatic disease).","ألم/رض/جراحة سابقة؛ أمراض مهمة (سرطان، عدوى، سكري، وعائية، روماتيزمية، عصبية)؛ فحوص سابقة؛ الاستجابة للعلاج؛ الأدوية الحالية (أفيونات، NSAIDs، ستيرويدات، مضادات تخثر، مضادات صفيحات)؛ الحساسية والسلامة (خطر النزف، أمراض الكلى/الكبد)."]]],
["t19","2","Physical Examination|الفحص السريري",[
["General approach","النهج العام","Observe before touching; record vital signs in acute/severe pain; compare sides; proceed inspection → palpation → movement → neurologic/vascular assessment; reproduce the familiar pain without unnecessary distress.","راقب قبل اللمس؛ سجل العلامات الحيوية في الألم الحاد/الشديد؛ قارن الجانبين؛ تدرج: الفحص البصري ← الجس ← الحركة ← التقييم العصبي/الوعائي؛ أعد إنتاج الألم المألوف دون إزعاج غير ضروري."],
["LOOK / FEEL / MOVE","انظر / المس / حرّك","Look: posture, distress, guarding, swelling, erythema, deformity. Feel: tenderness, temperature, mass, trigger points, pulses. Move: active/passive ROM, gait, functional movement, pain reproduction.","انظر: الوضعية، الضيق، الحماية، التورم، الاحمرار، التشوه. المس: الألم عند اللمس، الحرارة، الكتلة، نقاط الزناد، النبض. حرّك: مدى الحركة الفاعل/المنفعل، المشي، الحركة الوظيفية، إعادة إنتاج الألم."],
["NEURO / VASCULAR / DOCUMENT","عصبي / وعائي / توثيق","Neuro: power, sensation, reflexes, neural tension signs. Vascular: color, temperature, capillary refill, peripheral pulses. Document: compare sides; record objective positive and negative findings.","عصبي: القوة، الحس، المنعكسات، علامات التوتر العصبي. وعائي: اللون، الحرارة، إعادة امتلاء الشعيرات، النبض المحيطي. توثيق: قارن الجانبين وسجل الموجودات الموضوعية الإيجابية والسلبية."],
["Musculoskeletal exam","الفحص العضلي الهيكلي","Tests structure, movement and function, not pain intensity alone: ROM; strength (distinguish pain inhibition from true weakness); joint/soft tissue; region-specific special tests only for a clinical hypothesis; gait & function; adjacent regions for referred pain.","يختبر البنية والحركة والوظيفة لا شدة الألم وحدها: مدى الحركة؛ القوة (ميّز تثبيط الألم عن الضعف الحقيقي)؛ المفصل/النسيج الرخو؛ اختبارات خاصة لفرضية سريرية فقط؛ المشي والوظيفة؛ المناطق المجاورة للألم المحال."],
["Focused neurologic exam","الفحص العصبي الموجه","Motor power graded 0–5; sensory: light touch and pinprick mapped to dermatome/peripheral nerve; deep tendon reflexes (asymmetry helps localize); neural tension (straight-leg raise); gait/coordination; autonomic red flags: urinary retention, saddle anesthesia, new bowel dysfunction need urgent assessment.","قوة حركية بتدريج 0–5؛ الحس: اللمس الخفيف والوخز وتحديد الجلدة/العصب المحيطي؛ المنعكسات الوترية العميقة (عدم التماثل يساعد في التوطين)؛ التوتر العصبي (رفع الساق المستقيمة)؛ المشي/التناسق؛ العلامات اللاإرادية الحمراء: احتباس البول، تخدر السرج، خلل أمعاء جديد تتطلب تقييماً عاجلاً."],
["Neuropathic pain exam clues","دلائل الفحص للألم العصبي","Neural lesion/disease; neuroanatomic distribution; sensory abnormality; painful phenomena; neuropathic pattern. Burning or electric-shock pain, allodynia, hyperalgesia, numbness and a plausible nerve/root distribution support neuropathic pain.","آفة/مرض عصبي؛ توزع تشريحي عصبي؛ شذوذ حسي؛ ظواهر مؤلمة؛ نمط عصبي. الألم الحارق أو الصدمات الكهربائية، الألودينيا، فرط الألم، الخدر وتوزع معقول للعصب/الجذر تدعم الألم العصبي."]]],
["t20","2","Red Flags in Detail|العلامات الحمراء بالتفصيل",[
["Trauma / fracture","الرض / الكسر","Major trauma, deformity, focal bony tenderness, high fracture risk.","رض كبير، تشوه، ألم عظمي موضعي، خطر كسر مرتفع."],
["Infection","العدوى","Fever, immunosuppression, IV drug use, suspected spinal or deep infection.","حمى، كبت مناعي، تعاطي المخدرات وريدياً، اشتباه عدوى فقرية أو عميقة."],
["Malignancy","الأورام الخبيثة","Known cancer, unexplained weight loss, progressive or persistent night pain.","سرطان معروف، فقدان وزن غير مبرر، ألم ليلي متدرج أو مستمر."],
["Vascular / visceral","وعائي / حشوي","Syncope, hemodynamic instability, ischemic limb, sudden chest/abdominal pain.","إغماء، عدم استقرار دوراني، طرف إقفاري، ألم مفاجئ في الصدر/البطن."],
["Urgent action","الإجراء العاجل","Stabilize first, investigate the suspected emergency, and escalate to the appropriate specialty.","استقر أولاً، ثم افحص الحالة الطارئة المشتبهة، وصعّد إلى الاختصاص المناسب."]]],
["t21","2","Mechanism Classification & Mixed Pain|تصنيف الآليات والألم المختلط",[
["Nociceptive vs neuropathic","الحسي الاستقبالي مقابل العصبي","Nociceptive: tissue injury; somatic often well localized, visceral diffuse/referred (fracture, wound, osteoarthritis). Neuropathic: burning/electric/shooting, sensory deficit or allodynia (radiculopathy, diabetic neuropathy, postherpetic neuralgia).","الحسي الاستقبالي: إصابة نسيج؛ الجسدي غالباً محدد الموضع والحشوي منتشر/محال (كسر، جرح، فصال عظمي). العصبي: حارق/كهربائي/طاعن، عجز حسي أو ألودينيا (اعتلال جذور، اعتلال أعصاب سكري، ألم تالٍ للهربس)."],
["Nociplastic pain","الألم المتغير الإدراك","Altered nociception without clear evidence that tissue damage or a somatosensory lesion fully explains the pain. Features: widespread/multifocal pain, hypersensitivity, fatigue, sleep disturbance.","تغير في معالجة الألم دون دليل واضح أن تلف النسيج أو آفة حسية تفسره كلياً. السمات: ألم واسع/متعدد البؤر، فرط حساسية، تعب، اضطراب نوم."],
["Mixed pain","الألم المختلط","Nociceptive, neuropathic and/or nociplastic mechanisms can coexist; e.g., chronic low-back pain. Treatment should be mechanism-based and function-focused, not determined by pain score alone.","قد تتعايش الآليات الحسية الاستقبالية والعصبية والمتغيرة الإدراك؛ مثل ألم أسفل الظهر المزمن. يجب أن يكون العلاج قائماً على الآلية ومركزاً على الوظيفة لا على درجة الألم وحدها."]]],
["t22","2","Investigations & Imaging|الفحوص والتصوير",[
["When investigations are needed","متى تلزم الفحوص","Should answer a specific clinical question; ordered by history, examination and red flags. Labs: infection, inflammation, metabolic or systemic disease. Electrodiagnostic studies help selected patients with neuropathy or radiculopathy.","يجب أن تجيب عن سؤال سريري محدد؛ تُطلب وفق التاريخ والفحص والعلامات الحمراء. المخبرية: العدوى والالتهاب والأمراض الاستقلابية/الجهازية. الدراسات الكهربائية تفيد مرضى مختارين بالاعتلال العصبي أو اعتلال الجذور."],
["X-ray / Ultrasound","الأشعة السينية / الموجات فوق الصوتية","X-ray: fracture, alignment, degenerative change; limited soft-tissue detail. Ultrasound: superficial soft tissue, tendons, effusions; dynamic and radiation-free.","الأشعة السينية: كسر، محاذاة، تغيرات تنكسية؛ تفاصيل رخوة محدودة. الموجات فوق الصوتية: نسج رخوة سطحية، أوتار، انصبابات؛ ديناميكية وخالية من الإشعاع."],
["CT / MRI","الطبقي المحوري / الرنين المغناطيسي","CT: excellent bone detail; trauma, selected visceral/spinal pathology; ionizing radiation. MRI: best soft-tissue, disc, nerve root, spinal cord and marrow detail; no ionizing radiation. Abnormal imaging does not always equal the pain source.","الطبقي: تفاصيل عظمية ممتازة؛ الرضوض وآفات حشوية/فقرية مختارة؛ إشعاع مؤين. الرنين: أفضل تفاصيل للنسج الرخوة والقرص وجذر العصب والنخاع ونقي العظم؛ بلا إشعاع مؤين. التصوير غير الطبيعي لا يساوي دائماً مصدر الألم."]]],
["t23","2","Biopsychosocial Assessment & Diagnosis|التقييم الحيوي النفسي الاجتماعي والتشخيص",[
["Biopsychosocial model","النموذج الحيوي النفسي الاجتماعي","Biological: diagnosis, comorbidities, sleep, medications, function. Psychological: mood, anxiety, fear-avoidance, catastrophizing, coping. Social: work, family, finances, support, compensation. These do not imply the pain is psychological; they influence severity, disability, recovery and treatment response.","حيوي: التشخيص، الأمراض المرافقة، النوم، الأدوية، الوظيفة. نفسي: المزاج، القلق، تجنب الخوف، التهويل، التكيف. اجتماعي: العمل، الأسرة، المال، الدعم، التعويض. لا يعني ذلك أن الألم نفسي؛ بل تؤثر في الشدة والعجز والتعافي والاستجابة للعلاج."],
["From assessment to diagnosis","من التقييم إلى التشخيص","1 Define the pain syndrome (site, duration, pattern); 2 identify the mechanism (nociceptive, neuropathic, nociplastic, mixed); 3 localize the likely source; 4 check red flags; 5 build a differential (likely and dangerous); 6 order targeted tests only if results may change management.","1 حدد متلازمة الألم (الموقع، المدة، النمط)؛ 2 حدد الآلية؛ 3 وطّن المصدر المحتمل؛ 4 افحص العلامات الحمراء؛ 5 ابنِ تشخيصاً تفريقياً (المحتمل والخطير)؛ 6 اطلب فحوصاً موجهة فقط إذا كانت النتائج قد تغير التدبير."]]],
["t24","3","Pain Clinic Procedures & Room Equipment|إجراءات عيادة الألم ومعدات الغرفة",[
["Common procedures","الإجراءات الشائعة","The procedure determines the equipment and anesthesia plan. Trigger point injection: fine needle into a muscle trigger point. Peripheral nerve block: block needle ± ultrasound near target nerve. Epidural injection: spinal access needle, imaging, prescribed injectate. Facet/medial branch block: image-guided small-volume injection. Radiofrequency: generator, compatible cannula and electrode deliver energy to a target. Implanted devices: spinal cord stimulation and intrathecal pumps need specialist equipment and asepsis.","الإجراء يحدد المعدات وخطة التخدير. حقن نقطة الزناد: إبرة دقيقة في نقطة زناد عضلية. كتلة عصب طرفي: إبرة كتلة ± الموجات فوق الصوتية قرب العصب. حقن فوق الجافية: إبرة وصول فقرية وتصوير ومحلول موصوف. كتلة فرع الوجه/الإنسي: حقن صغير الحجم بالتصوير. الترددات الراديوية: مولد وقنية وقطب متوافقان يوصلان الطاقة. الأجهزة المزروعة: محفز الحبل الشوكي والمضخات داخل القراب تحتاج معدات متخصصة وتعقيماً."],
["Procedure room equipment","معدات غرفة الإجراءات","Procedure table (stable positioning; fluoroscopy requires a radiolucent table). Imaging: ultrasound or C-arm. Patient monitor: ECG, BP, pulse oximetry; capnography for sedation. Oxygen and suction: check before the patient arrives. Medication preparation: label syringes; separate local anesthetic, contrast, saline, sedatives. Emergency trolley: airway equipment, defibrillator, emergency drugs, LAST kit.","طاولة الإجراءات (تثبيت الوضعية؛ التنظير الفلوري يتطلب طاولة شفافة إشعاعياً). التصوير: الموجات فوق الصوتية أو الذراع C. مراقب المريض: تخطيط القلب وضغط الدم وقياس التأكسج؛ كابنوغرافيا عند التركين. الأكسجين والشفط: تحقق قبل وصول المريض. تحضير الدواء: علّم المحاقن وافصل المخدر الموضعي والتباين والمحلول الملحي والمهدئات. عربة الطوارئ: معدات المجرى الهوائي، مزيل الرجفان، أدوية الطوارئ، مجموعة LAST."],
["Equipment recognition","التعرف على المعدات","Ultrasound shows soft tissue; fluoroscopy shows X-ray images; the RF generator supplies treatment energy (monopolar RF uses a return pad). Infusion pump: syringe, pump controls, IV extension tubing. Airway rescue: bag-mask device, oxygen reservoir bag, face mask, suction tubing. Before the procedure check monitoring connections, pump setup, oxygen and airway rescue equipment.","الموجات فوق الصوتية تظهر الأنسجة الرخوة؛ التنظير الفلوري يظهر صور الأشعة السينية؛ مولد RF يوفر طاقة العلاج (RF أحادي القطب يستخدم وسادة إرجاع). مضخة التسريب: محقنة، أزرار تحكم، أنبوب تمديد وريدي. إنقاذ المجرى الهوائي: جهاز كيس-قناع، كيس خزان أكسجين، قناع وجه، أنبوب شفط. قبل الإجراء تحقق من اتصالات المراقبة وإعداد المضخة والأكسجين ومعدات الإنقاذ."]]],
["t25","3","Sterile Tray & Needle Checks|الصينية المعقمة وفحوص الإبر",[
["Sterile procedure tray","الصينية المعقمة","Prepare only instruments and medicines required for the planned procedure. Protective items: sterile gloves, appropriate mask, sterile drapes (gown varies). Skin prep: approved antiseptic, allow full drying, prevent pooling. Accessories: extension tubing, prescribed syringes, sterile gauze, dressing. Ultrasound: sterile probe cover and single-use sterile gel for invasive procedures. Sharps container within reach.","جهّز فقط الأدوات والأدوية اللازمة للإجراء المخطط. الوقاية: قفازات معقمة وكمامة مناسبة وستائر معقمة (العباءة حسب الإجراء). تحضير الجلد: المطهر المعتمد، اترك الجفاف الكامل، امنع التجمع. الملحقات: أنبوب تمديد، محاقن موصوفة، شاش معقم، ضماد. الموجات: غطاء مسبار معقم وجل معقم أحادي الاستخدام. حاوية الأدوات الحادة في المتناول."],
["Needle and connector checks","فحوص الإبرة والموصل","Confirm the requested device before opening the sterile package: gauge; length (reach the target without unnecessary excess); tip design (bevel, stylet, exposed RF active tip); compatibility of needle, extension, syringe and device; integrity (package seal, expiry, straightness, intact insulation); handling (protect the tip, keep sterility, avoid recapping used needles).","أكد الجهاز المطلوب قبل فتح العبوة المعقمة: المقياس؛ الطول (يصل للهدف دون زيادة)؛ تصميم الطرف (شطبة، مِسبَر، طرف RF نشط مكشوف)؛ توافق الإبرة والتمديد والمحقنة والجهاز؛ السلامة (ختم العبوة، الصلاحية، الاستقامة، العزل)؛ المناولة (احمِ الطرف، حافظ على التعقيم، تجنب إعادة تغطية الإبر المستخدمة)."],
["Needle types","أنواع الإبر","Hypodermic: skin infiltration and selected superficial injections. Echogenic block needle: surface features improve ultrasound visibility; the operator must still identify the tip. Spinal/access needle: styleted; selected image-guided spinal injections. The clinician selects type, gauge and length for the planned target and technique.","تحت الجلد: تسلل الجلد وحقن سطحية مختارة. إبرة الكتلة الصدوية: ميزات سطحية تحسن رؤيتها بالموجات؛ ويبقى على المشغل تحديد الطرف. إبرة العمود الفقري/الوصول: بمِسبَر؛ حقن فقرية موجهة بالصور. يختار الطبيب النوع والمقياس والطول للهدف والتقنية."]]],
["t26","3","Ultrasound Guidance|التوجيه بالموجات فوق الصوتية",[
["Ultrasound basics","أساسيات الموجات فوق الصوتية","Real-time images without ionizing radiation. Linear probe: higher frequency, better detail for superficial structures. Curved probe: lower frequency, better penetration for deeper structures.","صور فورية دون إشعاع مؤين. المسبار الخطي: تردد أعلى وتفاصيل أفضل للبنى السطحية. المسبار المنحني: تردد أقل ونفاذ أفضل للبنى العميقة."],
["Settings, Doppler & visibility","الإعدادات والدوبلر والرؤية","Select suitable depth, gain and focus before needle insertion. Doppler helps identify vessels but does not exclude every small vessel. The operator tracks the tip and observes injectate spread. Cover the probe and use sterile gel for invasive procedures.","اختر العمق والكسب والتركيز قبل إدخال الإبرة. الدوبلر يساعد في تحديد الأوعية لكنه لا يستبعد كل وعاء صغير. يتتبع المشغل الطرف وينتشر الحقن. غطِّ المسبار واستخدم جلاً معقماً في الإجراءات الغازية."]]],
["t27","3","Fluoroscopy & Radiation Protection|التنظير الفلوري والحماية من الإشعاع",[
["Fluoroscopy use","استخدام التنظير الفلوري","C-arm gives X-ray views of bony landmarks and needle position; commonly supports epidural, facet, medial branch and selected RF procedures. Contrast: assess spread and look for unintended vascular uptake.","الذراع C يعطي صور أشعة للمعالم العظمية وموضع الإبرة؛ يدعم عادة الإجراءات فوق الجافية والوجيهية والفرع الإنسي وبعض الترددات. التباين: تقييم الانتشار والبحث عن امتصاص وعائي غير مقصود."],
["Radiation protection","الحماية من الإشعاع","Short exposures and approved low-dose settings; increase distance from the source when care permits; shielding: apron, thyroid protection, protective screens, eye protection; keep hands out of the beam; follow pregnancy screening and dosimeter policy.","تعرضات قصيرة وإعدادات جرعة منخفضة معتمدة؛ زد المسافة عن المصدر عند السماح؛ التدريع: المئزر وحماية الدرقية والشاشات الواقية وحماية العين؛ أبقِ اليدين خارج الشعاع؛ اتبع فحص الحمل وسياسة مقياس الجرعات."]]],
["t28","3","Nerve Stimulator, Catheters & Implants|محفز الأعصاب والقسطرة والأجهزة المزروعة",[
["Peripheral nerve stimulator","محفز العصب المحيطي","Components: stimulator, connecting cable, skin electrode, compatible insulated needle. A motor response may help assess proximity to a nerve; check battery, cable connections, polarity and settings. Limitation: an absent response does not prove the needle is safely positioned. Student role: maintain connections and report changes; do not independently adjust clinical settings.","المكونات: محفز، كابل توصيل، قطب جلدي، إبرة معزولة متوافقة. قد تساعد الاستجابة الحركية في تقييم القرب من العصب؛ تحقق من البطارية والكابلات والقطبية والإعدادات. القيد: غياب الاستجابة لا يثبت أن الإبرة في وضع آمن. دور الطالب: حافظ على الاتصالات وبلّغ عن التغيرات ولا تضبط الإعدادات السريرية باستقلال."],
["Catheters & pumps","القسطرة والمضخات","Block catheter: repeated/continuous local anesthetic near a peripheral nerve. Epidural catheter: prescribed epidural medication; clearly identify the route. Infusion pump: controls delivery rate; verify medication, concentration, route and programmed rate.","قسطرة الكتلة: مخدر موضعي متكرر/مستمر قرب عصب محيطي. القسطرة فوق الجافية: أدوية موصوفة؛ حدد الطريق بوضوح. مضخة التسريب: تتحكم بمعدل التوصيل؛ تحقق من الدواء والتركيز والطريق والمعدل المبرمج."],
["Implanted devices","الأجهزة المزروعة","Intrathecal pump: implanted system delivering medication into the intrathecal space. Spinal cord stimulator: implanted or trial system delivering electrical stimulation rather than medication (pulse generator + electrode leads). Ongoing checks: connections, dressing, leakage, infection signs, unexpected weakness.","المضخة داخل القراب: نظام مزروع يوصل الدواء إلى الحيز داخل القراب. محفز الحبل الشوكي: نظام مزروع أو تجريبي يوفر تحفيزاً كهربائياً لا دواء (مولد نبضات + أسلاك أقطاب). فحوص مستمرة: الاتصالات، الضماد، التسرب، علامات العدوى، الضعف غير المتوقع."]]],
["t29","3","Emergency Equipment|معدات الطوارئ والإنقاذ",[
["Six rescue categories","الفئات الست","1 Airway support: oxygen, masks, bag-mask device, airway adjuncts. 2 Advanced airway: supraglottic airway and intubation equipment (laryngoscope, tracheal tube, oral airway). 3 Suction: working unit with tubing and catheter. 4 Circulatory support: IV supplies, fluids, defibrillator, emergency medicines. 5 Reversal agents: naloxone and flumazenil, clinician-directed. 6 LAST kit: 20% lipid emulsion, administration supplies, ASRA checklist.","1 دعم المجرى: أكسجين، أقنعة، جهاز كيس-قناع، مساعدات. 2 المجرى المتقدم: مجرى فوق المزمار ومعدات التنبيب (منظار الحنجرة، أنبوب رغامي، مجرى فموي). 3 الشفط: وحدة عاملة مع أنابيب وقسطرة. 4 دعم الدورة: لوازم وريدية وسوائل ومزيل رجفان وأدوية طوارئ. 5 عوامل الانعكاس: نالوكسون وفلومازينيل بتوجيه الطبيب. 6 مجموعة LAST: مستحلب دهون 20% ولوازم الإعطاء وقائمة ASRA."]]],
["t30","3","Pre-procedure Assessment & Safety Check|التقييم وفحص السلامة قبل الإجراء",[
["Patient assessment","تقييم المريض","The responsible clinician assesses risk and chooses the anesthesia plan. Medical history: cardiorespiratory disease, sleep apnea, previous anesthesia problems, pregnancy risk. Medications: anticoagulants, antiplatelets, opioids, sedating medicines. Allergies: medicines, contrast, antiseptics, latex. Baseline: vital signs, neurological status, airway findings. Report fever, local infection, unresolved bleeding risk. Confirm consent, fasting when applicable, and an escort after sedation.","يقيّم الطبيب المسؤول الخطر ويختار خطة التخدير. التاريخ الطبي: أمراض قلبية تنفسية، انقطاع النفس النومي، مشاكل تخدير سابقة، خطر الحمل. الأدوية: مضادات التخثر والصفيحات والأفيونات والمهدئات. الحساسية: الأدوية والتباين والمطهرات واللاتكس. الأساس: العلامات الحيوية والحالة العصبية وموجودات المجرى. أبلغ عن الحمى والعدوى الموضعية وخطر النزف. أكد الموافقة والصيام عند الحاجة ومرافقاً بعد التركين."],
["Team safety check","فحص السلامة للفريق","The whole team confirms readiness before needle insertion or sedation: patient and consent (identity, procedure, valid informed consent); site and side (target, level, laterality); clinical risks (allergies, infection, documented anticoagulation plan); medicines (read every label: drug, concentration, dose, route); equipment; rescue and team (who monitors, how to call for help).","يؤكد الفريق كله الجاهزية قبل إدخال الإبرة أو التركين: المريض والموافقة (الهوية، الإجراء، موافقة مستنيرة صالحة)؛ الموقع والجانب (الهدف، المستوى، الجانبية)؛ المخاطر (الحساسية، العدوى، خطة مضادات التخثر الموثقة)؛ الأدوية (اقرأ كل ملصق: الدواء والتركيز والجرعة والطريق)؛ المعدات؛ الإنقاذ والفريق (من يراقب وكيف يُطلب العون)."]]],
["t31","3","Anesthesia Options & Sedative Drugs|خيارات التخدير والأدوية المهدئة",[
["Anesthesia options","خيارات التخدير","Local: skin infiltration for short injections. Regional: peripheral or neuraxial block interrupts conduction in a region. Minimal sedation: reduces anxiety, normal response to commands. Moderate: purposeful response; needs monitoring and rescue capability. MAC: service that can include different depths. General: selected procedures/patients with an anesthesia team.","موضعي: تسلل الجلد للحقن القصيرة. إقليمي: كتلة طرفية أو محورية تقطع التوصيل في منطقة. تركين أدنى: يقلل القلق مع استجابة طبيعية للأوامر. متوسط: استجابة هادفة؛ يتطلب مراقبة وقدرة إنقاذ. MAC: خدمة قد تشمل أعماقاً مختلفة. عام: لإجراءات ومرضى مختارين مع فريق تخدير."],
["Sedatives & analgesics","المهدئات والمسكنات","Midazolam: anxiolysis and amnesia; respiratory depression, especially with opioids. Fentanyl: opioid analgesia; monitor respiratory depression. Propofol: sedation/anesthesia; no reliable analgesia; apnea or hypotension. Dexmedetomidine: sedation; bradycardia and hypotension; airway monitoring still needed. Sedatives plus opioids give greater respiratory depression. Ropivacaine: longer-acting for selected blocks; systemic toxicity remains possible.","ميدازولام: إزالة القلق وفقدان الذاكرة؛ اكتئاب تنفسي خاصة مع الأفيونات. فنتانيل: مسكن أفيوني؛ راقب الاكتئاب التنفسي. بروبوفول: تركين/تخدير؛ لا تسكين موثوق؛ انقطاع النفس أو هبوط الضغط. ديكسميديتوميدين: تركين؛ بطء القلب وهبوط الضغط؛ تبقى مراقبة المجرى لازمة. المهدئات مع الأفيونات تزيد الاكتئاب التنفسي. روبيفاكائين: أطول أمداً لكتل مختارة؛ تبقى السمية الجهازية ممكنة."]]],
["t32","3","Monitoring, Positioning & Blocks|المراقبة والوضعية والكتل",[
["Monitoring during the procedure","المراقبة أثناء الإجراء","A designated trained person continuously observes the patient and monitors. Oxygenation: pulse oximetry, waveform, oxygen delivery. Ventilation: breathing, airway patency, exhaled CO₂ monitoring during sedation. Circulation: ECG, heart rate; during anesthesia assess blood pressure at least every 5 minutes. Check responsiveness against intended depth; ask about pain; document observations, medicines, fluids and events.","شخص مدرب معيّن يراقب المريض والأجهزة باستمرار. الأكسجة: قياس التأكسج وجودة الموجة وتوصيل الأكسجين. التهوية: التنفس وسالكية المجرى ومراقبة CO₂ الزفيري أثناء التركين. الدورة: تخطيط القلب ومعدله؛ أثناء التخدير قِس الضغط كل 5 دقائق على الأقل. قارن الاستجابة بالعمق المقصود؛ اسأل عن الألم؛ وثّق الملاحظات والأدوية والسوائل والأحداث."],
["Positioning","الوضعية","Allow procedural access and safe anesthesia care. Prone: common for spinal procedures; confirm chest movement and adequate breathing. Supine/lateral: selected procedures. Pressure protection: support limbs, protect eyes, skin and pressure points. Keep the face accessible; agree how to turn the patient for rescue. Secure IV, oxygen and monitoring without kinks. Reassess comfort, vital signs and ventilation after every position change.","اسمح بالوصول الإجرائي ورعاية تخدير آمنة. الانبطاح: شائع لإجراءات العمود الفقري؛ تأكد من حركة الصدر وكفاية التنفس. الاستلقاء/الجانبي: لإجراءات مختارة. الحماية من الضغط: دعم الأطراف وحماية العينين والجلد ونقاط الضغط. أبقِ الوجه متاحاً؛ اتفقوا على كيفية قلب المريض للإنقاذ. ثبّت الوريد والأكسجين والمراقبة بلا التواءات. أعد تقييم الراحة والعلامات الحيوية والتهوية بعد كل تغيير."],
["Peripheral blocks","الكتل الطرفية","Baseline: record pain, sensory findings and motor function before the block. During injection: maintain monitoring and communication; alert the operator to severe pain or new symptoms. Prepare ultrasound and sterile probe cover. After the block: reassess pain, sensation, motor function and adverse effects. Advice: protect numb areas from pressure, heat and injury until sensation returns.","الأساس: سجل الألم والموجودات الحسية والوظيفة الحركية قبل الكتلة. أثناء الحقن: حافظ على المراقبة والتواصل؛ نبّه المشغل للألم الشديد أو الأعراض الجديدة. جهّز الموجات وغطاء المسبار المعقم. بعد الكتلة: أعد تقييم الألم والحس والحركة والآثار الضارة. النصيحة: احمِ المناطق المخدرة من الضغط والحرارة والإصابة حتى يعود الحس."]]],
["t33","3","Spinal Injections & RF Workflow|حقن العمود الفقري وسير عمل الترددات الراديوية",[
["Spinal pain injections","حقن ألم العمود الفقري","Epidural and facet procedures need procedure-specific planning and image guidance. Verify local anesthetic, contrast and corticosteroid separately when ordered. Confirm a documented antithrombotic plan. Keep the patient able to report new pain or neurological symptoms. Complications: dural puncture, bleeding, infection, unexpected neurological change. Epidural corticosteroids are not FDA-approved for this route and carry rare serious risks.","تتطلب الإجراءات فوق الجافية والوجيهية تخطيطاً خاصاً وتوجيهاً بالصور. تحقق من المخدر الموضعي والتباين والكورتيكوستيرويد كلاً على حدة عند الطلب. أكد خطة مضادات التخثر الموثقة. أبقِ المريض قادراً على الإبلاغ عن ألم أو أعراض عصبية جديدة. المضاعفات: ثقب الجافية والنزف والعدوى وتغير عصبي غير متوقع. الكورتيكوستيرويدات فوق الجافية غير معتمدة من FDA لهذا الطريق وتحمل مخاطر ردة نادرة."],
["Radiofrequency team workflow","سير عمل الفريق في الترددات الراديوية","The operator controls target selection, testing and treatment settings. Preparation: consent, target, laterality, device compatibility, implanted devices. Position and imaging. Access and connection: maintain asepsis while the clinician positions the cannula and connects the electrode. Testing: support sensory/motor testing and report responses. Energy delivery: observe patient and generator; report alarms or unexpected pain. Recovery: reassess observations and neurological function; record details.","يتحكم المشغل في اختيار الهدف والاختبار وإعدادات العلاج. التحضير: الموافقة والهدف والجانبية وتوافق الجهاز والأجهزة المزروعة. الوضعية والتصوير. الوصول والتوصيل: حافظ على التعقيم أثناء وضع القنية وتوصيل القطب. الاختبار: ادعم الاختبار الحسي/الحركي وبلّغ عن الاستجابات. إيصال الطاقة: راقب المريض والمولد؛ بلّغ عن الإنذارات أو الألم غير المتوقع. التعافي: أعد تقييم الملاحظات والوظيفة العصبية ووثق التفاصيل."]]],
["t34","3","Complications, Recovery & Case Answers|المضاعفات والتعافي وأجوبة الحالات",[
["Early recognition of complications","التعرف المبكر على المضاعفات","Respiratory depression: reduced breathing, airway obstruction, reduced responsiveness. Hypotension/vasovagal: pallor, sweating, dizziness, nausea, bradycardia. LAST: neurological symptoms, seizures, arrhythmias. Allergic reaction: urticaria, swelling, wheeze, collapse. Neurological change: unexpected weakness, sensory loss, severe new pain. Delayed: fever, progressive pain, infection signs, new deficits after discharge. Unexpected symptoms need a prompt pause, assessment and escalation.","اكتئاب تنفسي: انخفاض التنفس أو انسداد المجرى أو انخفاض الاستجابة. هبوط ضغط/وعائي مبهمي: شحوب وتعرق ودوخة وغثيان وبطء قلب. LAST: أعراض عصبية ونوبات واضطراب نظم. تحسس: شرى وتورم وصفير وانهيار. تغير عصبي: ضعف أو فقد حسي أو ألم جديد شديد. متأخرة: حمى وألم متزايد وعلامات عدوى وعجز جديد بعد الخروج. الأعراض غير المتوقعة تتطلب إيقافاً مؤقتاً وتقييماً وتصعيداً فورياً."],
["Recovery & discharge","التعافي والخروج","Discharge follows documented criteria and approval by the responsible clinician. Observation until recovery criteria are met; confirm adequate ventilation, oxygenation and stable hemodynamics; check alertness and motor/sensory findings against baseline; review pain, nausea, bleeding; arrange assistance and an escort after sedation; follow driving and activity restrictions; give written advice for fever, severe pain or new neurological symptoms.","يتبع الخروج معايير موثقة وموافقة الطبيب المسؤول. استمر بالمراقبة حتى تتحقق معايير التعافي؛ تأكد من تهوية وأكسجة كافيتين ودورة مستقرة؛ افحص اليقظة والموجودات الحركية/الحسية مقابل الأساس؛ راجع الألم والغثيان والنزف؛ رتّب المساعدة ومرافقاً بعد التركين؛ اتبع قيود القيادة والنشاط؛ قدّم تعليمات مكتوبة للحمى والألم الشديد والأعراض العصبية الجديدة."],
["Case answers","أجوبة الحالات","Case 1 (prone patient hard to rouse): pause the procedure, call for help, assess airway, ventilation and circulation. Case 2 (tinnitus, metallic taste): possible LAST — stop the injection, alert the clinician, bring the LAST kit and checklist. Case 3 (unclear syringe label): do not administer an unidentified medicine; resolve the label and verify with the clinician. RF compatibility: match device model, electrode/cannula length and manufacturer specifications. MAC: assess actual sedation depth from responsiveness, airway and ventilation.","الحالة 1 (مريض منبطح يصعب إيقاظه): أوقف الإجراء مؤقتاً واطلب المساعدة وقيّم المجرى والتهوية والدورة. الحالة 2 (طنين وطعم معدني): احتمال LAST — أوقف الحقن ونبّه الطبيب وأحضر مجموعة LAST وقائمة التحقق. الحالة 3 (ملصق محقنة غير واضح): لا تُعطِ دواءً مجهولاً؛ أوضح الملصق وتحقق مع الطبيب. توافق RF: طابق طراز الجهاز وطول القطب/القنية ومواصفات الشركة. MAC: قيّم عمق التركين الفعلي من الاستجابة والمجرى والتهوية."]]]
];
